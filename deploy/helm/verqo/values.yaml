# Default values for the verqo chart. Override per environment with
# -f values-staging.yaml / -f values-prod.yaml or --set.

namespace: verqo

image:
  registry: "" # e.g. asia-south1-docker.pkg.dev/<project>/verqo
  api:
    repository: verqo-api
    tag: "0.1.0"
  web:
    repository: verqo-web
    tag: "0.1.0"
  pullPolicy: IfNotPresent

api:
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: "100m", memory: "192Mi" }
    limits: { cpu: "500m", memory: "384Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  env:
    aspnetcoreEnvironment: Production
    corsAllowedOrigins: "https://app.verqo.example.com"
    jwtIssuer: verqo-api
    jwtAudience: verqo-clients

web:
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: app.verqo.example.com
  apiHost: api.verqo.example.com
  tlsSecretName: verqo-tls

# The database is a managed, external service (Cloud SQL for PostgreSQL /
# RDS for PostgreSQL / Azure Database for PostgreSQL Flexible Server,
# depending on final cloud choice — see docs/ARCHITECTURE.md). This chart
# never deploys Postgres in-cluster. `connectionSecretName` must already
# exist in the target namespace (created out-of-band by whatever secret
# manager the platform team uses — Sealed Secrets, External Secrets
# Operator, or the cloud provider's own Secret Manager CSI driver are all
# fine; a plain `kubectl create secret` is enough for a first environment).
database:
  connectionSecretName: verqo-db-credentials
  connectionSecretKey: connectionString

secrets:
  # Same pattern as `database` above: this chart expects the Secret to
  # already exist; it only references it by name/key.
  appSecretsName: verqo-app-secrets
  jwtSigningKeyKey: jwtSigningKey
  aadhaarHashPepperKey: aadhaarHashPepper
