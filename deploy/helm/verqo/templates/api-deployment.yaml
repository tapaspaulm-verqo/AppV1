apiVersion: apps/v1
kind: Deployment
metadata:
  name: verqo-api
  namespace: {{ .Values.namespace }}
  labels:
    app: verqo-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: verqo-api
  template:
    metadata:
      labels:
        app: verqo-api
    spec:
      # Postgres is managed and external, so pod disruption/rescheduling
      # never risks database availability — the whole point of not running
      # it in-cluster.
      containers:
        - name: verqo-api
          image: "{{ .Values.image.registry }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: verqo-api-config
          env:
            - name: ConnectionStrings__VerqoDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.connectionSecretName }}
                  key: {{ .Values.database.connectionSecretKey }}
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appSecretsName }}
                  key: {{ .Values.secrets.jwtSigningKeyKey }}
            - name: Kyc__AadhaarHashPepper
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.appSecretsName }}
                  key: {{ .Values.secrets.aadhaarHashPepperKey }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # dotnet needs a writable /tmp even with a read-only root filesystem.
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: verqo-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: verqo-api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
  type: ClusterIP
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: verqo-api
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: verqo-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
