# NOT a Helm template (.txt extension deliberately, so Helm never renders or
# installs this). This chart expects the two Secrets below to already exist
# in the target namespace — created out-of-band by whatever secret manager
# the platform team uses (External Secrets Operator syncing from Google
# Secret Manager / AWS Secrets Manager / Azure Key Vault is the usual
# production answer; Sealed Secrets is a good GitOps-friendly alternative;
# a plain `kubectl create secret` is enough to stand up a first environment).
#
# This file exists purely as copy-pasteable documentation of the exact
# shape each Secret needs. Fill in real values and apply directly (or feed
# them into whatever secret-management tool you're using) — never commit
# real values to source control.

apiVersion: v1
kind: Secret
metadata:
  name: verqo-db-credentials
  namespace: verqo
type: Opaque
stringData:
  # Managed PostgreSQL (Cloud SQL / RDS / Azure Flexible Server — see
  # docs/ARCHITECTURE.md). On GCP, prefer connecting through the Cloud SQL
  # Auth Proxy sidecar instead of a raw host:port + public IP; the
  # connection string below then points at 127.0.0.1.
  connectionString: "Host=<db-host>;Port=5432;Database=verqo;Username=verqo;Password=<generated>;SslMode=Require"
---
apiVersion: v1
kind: Secret
metadata:
  name: verqo-app-secrets
  namespace: verqo
type: Opaque
stringData:
  # >= 32 random bytes, base64 or hex — e.g. `openssl rand -base64 48`.
  jwtSigningKey: "<generate-a-strong-random-key>"
  # App-wide secret used to salt the Aadhaar duplicate-detection hash (see
  # Verqo.Application.Kyc.AadhaarValidator.Hash). Generate once per
  # environment and never rotate casually — rotating it invalidates every
  # stored hash's ability to detect a duplicate Aadhaar re-registration.
  aadhaarHashPepper: "<generate-a-strong-random-value>"
