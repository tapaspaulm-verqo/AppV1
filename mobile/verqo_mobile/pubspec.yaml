name: verqo_mobile
description: >
  Verqo — India's tech freelance marketplace. Single Flutter codebase for
  Android and iOS, consuming the same .NET Web API the Angular web app uses.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1 # IBM Plex Sans + Inter, per brand tokens

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
